<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CepMelodi</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); color: #fff; min-height: 100vh; padding-bottom: 70px; }
        
        /* Üst Bilgi Barı */
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px; }
        .logo { font-size: 22px; font-weight: bold; display: flex; align-items: center; gap: 8px; color: #00f2fe; }
        
        /* Arama Kutusu */
        .search-box { padding: 0 20px; margin-bottom: 20px; }
        .search-box input { width: 100%; padding: 12px 18px; border-radius: 25px; border: none; background: rgba(255,255,255,0.1); color: #fff; font-size: 14px; outline: none; }
        .search-box input::placeholder { color: #aaa; }

        /* Bölüm Başlıkları */
        .section-title { padding: 0 20px; font-size: 18px; margin-bottom: 12px; font-weight: 600; }

        /* Liste Öğeleri (Şarkılar) */
        .music-list { padding: 0 20px; display: flex; flex-direction: column; gap: 10px; }
        .music-item { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.07); padding: 10px 15px; border-radius: 12px; transition: 0.2s; }
        .music-info { display: flex; align-items: center; gap: 12px; }
        .music-thumb { width: 45px; height: 45px; border-radius: 8px; background: #444; object-fit: cover; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .music-details h4 { font-size: 14px; margin-bottom: 3px; }
        .music-details p { font-size: 12px; color: #aaa; }
        
        .music-actions { display: flex; gap: 8px; }
        button.action-btn { background: none; border: none; color: #fff; cursor: pointer; font-size: 18px; padding: 6px; border-radius: 50%; transition: 0.2s; }
        button.action-btn:hover { background: rgba(255,255,255,0.1); }
        button.download-btn { color: #00f2fe; }
        button.delete-btn { color: #ff4757; }

        /* Pencereler (Sayfalar arası geçiş için) */
        .page { display: none; }
        .page.active { display: block; }

        /* "Müziklerim" Penceresi Özel Başlık & Geri Tuşu */
        .sub-header { display: flex; align-items: center; gap: 15px; padding: 20px; }
        .back-btn { background: rgba(255,255,255,0.1); border: none; color: #fff; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 5px; }

        /* Alt Navigasyon Çubuğu */
        nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(15, 12, 41, 0.95); backdrop-filter: blur(10px); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid rgba(255,255,255,0.1); z-index: 100; }
        nav button { background: none; border: none; color: #aaa; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; transition: 0.2s; }
        nav button.active { color: #00f2fe; }
        nav button span { font-size: 18px; }

        /* Çalınıyor Çubuğu (Mini Player) */
        .mini-player { position: fixed; bottom: 65px; left: 10px; right: 10px; background: #1f1b42; padding: 10px 15px; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; border: 1px solid rgba(255,255,255,0.1); display: none; }
        .mini-player.show { display: flex; }
    </style>
</head>
<body>

    <!-- 1. ANA SAYFA -->
    <div id="home-page" class="page active">
        <header>
            <div class="logo">🎵 CepMelodi</div>
        </header>

        <div class="search-box">
            <input type="text" placeholder="Şarkı, Sanatçı veya Albüm Ara...">
        </div>

        <div class="section-title">Popüler Müzikler</div>
        <div class="music-list" id="home-music-list">
            <!-- Örnek Şarkılar -->
            <div class="music-item">
                <div class="music-info">
                    <div class="music-thumb">🎧</div>
                    <div class="music-details">
                        <h4>Gece Gölgenin Rahatına Bak</h4>
                        <p>Çağatay Akman • 3:25</p>
                    </div>
                </div>
                <div class="music-actions">
                    <button class="action-btn" onclick="playMusic('Gece Gölgenin Rahatına Bak', 'Çağatay Akman', 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3')">▶️</button>
                    <button class="action-btn download-btn" onclick="downloadMusic('Gece Gölgenin Rahatına Bak', 'Çağatay Akman', 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3')">📥</button>
                </div>
            </div>

            <div class="music-item">
                <div class="music-info">
                    <div class="music-thumb">🎸</div>
                    <div class="music-details">
                        <h4>Aşkın Olayım</h4>
                        <p>Simge • 3:50</p>
                    </div>
                </div>
                <div class="music-actions">
                    <button class="action-btn" onclick="playMusic('Aşkın Olayım', 'Simge', 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3')">▶️</button>
                    <button class="action-btn download-btn" onclick="downloadMusic('Aşkın Olayım', 'Simge', 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3')">📥</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 2. MÜZİKLERİM (İNDİRİLENLER) PENCERESİ -->
    <div id="downloads-page" class="page">
        <div class="sub-header">
            <button class="back-btn" onclick="goHome()">⬅️ Geri Dön</button>
            <h2>İndirilen Müziklerim</h2>
        </div>
        <div class="music-list" id="downloaded-music-list">
            <!-- İndirilenler buraya dinamik gelecek -->
        </div>
    </div>

    <!-- MİNİ OYNATICI -->
    <div class="mini-player" id="miniPlayer">
        <div class="music-info">
            <div class="music-thumb" style="width:35px;height:35px;font-size:14px;">🎶</div>
            <div class="music-details">
                <h4 id="player-title" style="font-size:13px;">Şarkı Adı</h4>
                <p id="player-artist" style="font-size:11px;">Sanatçı</p>
            </div>
        </div>
        <button class="action-btn" onclick="stopMusic()">⏹️</button>
    </div>

    <!-- ALT MENÜ -->
    <nav>
        <button id="nav-home" class="active" onclick="goHome()">
            <span>🏠</span> Ana Sayfa
        </button>
        <button id="nav-downloads" onclick="openDownloads()">
            <span>📂</span> Müziklerim
        </button>
    </nav>

    <audio id="audioElement"></audio>

    <script>
        let currentAudio = document.getElementById('audioElement');

        // Sayfa Değiştirme Fonksiyonları
        function goHome() {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('home-page').classList.add('active');
            
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            document.getElementById('nav-home').classList.add('active');
        }

        function openDownloads() {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('downloads-page').classList.add('active');
            
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            document.getElementById('nav-downloads').classList.add('active');

            loadDownloadedList();
        }

        // Müzik Çalma
        function playMusic(title, artist, url) {
            currentAudio.src = url;
            currentAudio.play();
            
            document.getElementById('player-title').innerText = title;
            document.getElementById('player-artist').innerText = artist;
            document.getElementById('miniPlayer').classList.add('show');
        }

        function stopMusic() {
            currentAudio.pause();
            document.getElementById('miniPlayer').classList.remove('show');
        }

        // Müzik İndirme (LocalStorage'a kaydetme)
        function downloadMusic(title, artist, url) {
            let downloads = JSON.parse(localStorage.getItem('cepMelodiDownloads')) || [];
            
            // Aynı şarkı daha önce eklenmiş mi kontrol et
            if (!downloads.some(song => song.title === title)) {
                downloads.push({ title, artist, url });
                localStorage.setItem('cepMelodiDownloads', JSON.stringify(downloads));
                alert(`"${title}" başarıyla indirildi! "Müziklerim" bölümünden dinleyebilirsin.`);
            } else {
                alert("Bu şarkı zaten indirilenlerde mevcut.");
            }
        }

        // İndirilenleri Listeleme
        function loadDownloadedList() {
            let listContainer = document.getElementById('downloaded-music-list');
            let downloads = JSON.parse(localStorage.getItem('cepMelodiDownloads')) || [];
            
            listContainer.innerHTML = '';

            if (downloads.length === 0) {
                listContainer.innerHTML = '<p style="text-align:center; color:#aaa; margin-top:30px;">Henüz indirilen müzik yok.</p>';
                return;
            }

            downloads.forEach((song, index) => {
                listContainer.innerHTML += `
                    <div class="music-item">
                        <div class="music-info">
                            <div class="music-thumb">💾</div>
                            <div class="music-details">
                                <h4>${song.title}</h4>
                                <p>${song.artist}</p>
                            </div>
                        </div>
                        <div class="music-actions">
                            <button class="action-btn" onclick="playMusic('${song.title}', '${song.artist}', '${song.url}')">▶️</button>
                            <button class="action-btn delete-btn" onclick="removeDownload(${index})">🗑️</button>
                        </div>
                    </div>
                `;
            });
        }

        // İndirilenlerden Silme
        function removeDownload(index) {
            let downloads = JSON.parse(localStorage.getItem('cepMelodiDownloads')) || [];
            downloads.splice(index, 1);
            localStorage.setItem('cepMelodiDownloads', JSON.stringify(downloads));
            loadDownloadedList();
        }
    </script>
</body>
</html>
