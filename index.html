<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIRNAV - Tırların Yol Arkadaşı</title>
    <!-- Leaflet Harita Kütüphanesi -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b132b; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Üst Bilgi / Header */
        header { padding: 15px; text-align: center; background: #1c2541; border-bottom: 1px solid #3a506b; }
        header h1 { font-size: 20px; color: #48cae4; letter-spacing: 1px; }

        /* Ana İçerik Alanı */
        #container { flex: 1; position: relative; display: flex; flex-direction: column; }
        #map { flex: 1; width: 100%; height: 100%; z-index: 1; }

        /* Kontrol Paneli (Görsel 1'deki Ana Sayfa Formu) */
        .control-panel {
            position: absolute; bottom: 70px; left: 15px; right: 15px;
            background: rgba(28, 37, 65, 0.95); backdrop-filter: blur(10px);
            padding: 20px; border-radius: 16px; border: 1px solid #3a506b; z-index: 1000;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .input-group { margin-bottom: 15px; display: flex; align-items: center; background: #0b132b; padding: 12px; border-radius: 10px; border: 1px solid #3a506b; }
        .input-group span { margin-right: 10px; font-size: 18px; }
        .input-group input { background: transparent; border: none; color: #fff; outline: none; width: 100%; font-size: 14px; }
        
        .btn-primary {
            width: 100%; background: linear-gradient(135deg, #0077b6, #00b4d8); color: white;
            border: none; padding: 14px; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer;
            transition: 0.3s;
        }
        .btn-primary:hover { opacity: 0.9; }

        /* Alt Navigasyon Çubuğu (Görseldeki Menü) */
        nav {
            height: 65px; background: #1c2541; display: flex; justify-content: space-around;
            align-items: center; border-top: 1px solid #3a506b; z-index: 1000;
        }
        nav div { text-align: center; font-size: 11px; color: #8d99ae; cursor: pointer; }
        nav div.active { color: #48cae4; }
        nav div span { display: block; font-size: 18px; margin-bottom: 2px; }

        /* Navigasyon Aktif Bilgi Kutusu */
        .nav-overlay {
            position: absolute; top: 20px; left: 15px; right: 15px;
            background: rgba(11, 19, 43, 0.9); padding: 15px; border-radius: 12px;
            border: 1px solid #00b4d8; z-index: 1000; display: none;
            justify-content: space-between; align-items: center;
        }
        .nav-overlay h3 { font-size: 16px; color: #48cae4; }
        .nav-overlay p { font-size: 13px; color: #adb5bd; }
        
        .btn-danger {
            background: #d90429; color: white; border: none; padding: 8px 14px;
            border-radius: 8px; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>TIRNAV</h1>
    </header>

    <div id="container">
        <!-- Aktif Navigasyon Üst Bilgi -->
        <div class="nav-overlay" id="navOverlay">
            <div>
                <h3 id="targetTitle">Rota Oluşturuldu</h3>
                <p>Yolculuk Devam Ediyor...</p>
            </div>
            <button class="btn-danger" onclick="endTrip()">Yolculuğu Bitir</button>
        </div>

        <!-- Harita Alanı -->
        <div id="map"></div>

        <!-- Rota Oluşturma Paneli -->
        <div class="control-panel" id="controlPanel">
            <div class="input-group">
                <span>📍</span>
                <input type="text" id="startLocation" value="Sultanbeyli / İstanbul" readonly>
            </div>
            <div class="input-group">
                <span>🎯</span>
                <input type="text" id="endLocation" placeholder="Varış noktası (Adres, şehir veya ülke girin)">
            </div>
            <button class="btn-primary" onclick="createRoute()">Rota Oluştur</button>
        </div>
    </div>

    <!-- Alt Menü -->
    <nav>
        <div class="active"><span>🏠</span>Ana Sayfa</div>
        <div><span>🗺️</span>Harita</div>
        <div><span>🅿️</span>Parklar</div>
        <div><span>⛽</span>Yakıt</div>
        <div><span>⚙️</span>Diğer</div>
    </nav>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Harita Başlatma (Sultanbeyli / İstanbul Odaklı)
        let map = L.map('map', {zoomControl: false}).setView([40.9631, 29.2662], 13);

        // Koyu Tema Harita Katmanı (CartoDB Dark Matter)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        // Kullanıcı Konum İşaretçisi
        let marker = L.marker([40.9631, 29.2662]).addTo(map)
            .bindPopup("Mevcut Konumunuz: Sultanbeyli / İstanbul").openPopup();

        // Sesli Asistan Fonksiyonu
        function speak(text) {
            if ('speechSynthesis' in window) {
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'tr-TR';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        // Rota Oluşturma ve Yolculuğa Başlama
        function createRoute() {
            let destination = document.getElementById('endLocation').value;
            if(!destination) {
                alert("Lütfen bir varış noktası girin.");
                return;
            }

            // Arayüz Değişimi
            document.getElementById('controlPanel').style.display = 'none';
            document.getElementById('navOverlay').style.display = 'flex';
            document.getElementById('targetTitle').innerText = "Rota: " + destination;

            // Sesli Asistan Anonsu
            speak("Rota oluşturuluyor. Keyifli sürüşler dilerim.");

            // Simüle Edilmiş Rota Çizgisi (İstanbul - Ankara Hattı Örneği)
            let latlngs = [
                [40.9631, 29.2662],
                [40.9800, 29.3500],
                [40.7500, 30.3500]
            ];
            let polyline = L.polyline(latlngs, {color: '#00b4d8', weight: 6}).addTo(map);
            map.fitBounds(polyline.getBounds());
        }

        // Yolculuğu Bitir
        function endTrip() {
            speak("Yolculuk bitmiştir. Mutlu günler dilerim.");
            document.getElementById('navOverlay').style.display = 'none';
            document.getElementById('controlPanel').style.display = 'block';
            document.getElementById('endLocation').value = '';
            map.setView([40.9631, 29.2662], 13);
        }
    </script>
</body>
</html>
