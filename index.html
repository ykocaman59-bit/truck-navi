<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sesli ve Akıllı Navigasyon</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #070e1b; color: #fff; height: 100vh; width: 100vw; overflow: hidden; display: flex; flex-direction: column; }
        #map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .ui-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 12px; }
        .interactive { pointer-events: auto; }
        .card { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); border: 1px solid #334155; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        input { padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #070e1b; color: #fff; font-size: 14px; outline: none; width: 100%; }
        .btn { background: #10b981; color: white; border: none; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; text-align: center; }
        .btn-red { background: #ef4444; }
        .hud { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); border: 1px solid #334155; border-radius: 14px; padding: 12px; display: flex; justify-content: space-around; text-align: center; }
        .hud-val { font-size: 15px; font-weight: bold; color: #38bdf8; }
        .hud-lbl { font-size: 10px; color: #94a3b8; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="ui-container">
        <div class="card interactive" id="search-card">
            <h2 style="font-size: 15px; color: #38bdf8;">🧭 Akıllı Navigasyon</h2>
            <input type="text" id="destination" placeholder="Nereye gitmek istiyorsunuz? (Örn: Kadıköy, İstanbul)">
            <button class="btn" onclick="startNavigation()">Yolculuğa Başla</button>
        </div>

        <div class="card interactive" id="nav-card" style="display: none;">
            <div class="hud">
                <div><div class="hud-val" id="dist">--</div><div class="hud-lbl">Mesafe</div></div>
                <div style="border-left: 1px solid #334155;"></div>
                <div><div class="hud-val" id="time">--</div><div class="hud-lbl">Süre</div></div>
            </div>
            <button class="btn btn-red" onclick="endNavigation()">Yolculuğu Bitir</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map', { zoomControl: false }).setView([41.0082, 28.9784], 13);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);

        let userLat = 41.0082, userLon = 28.9784;
        let routeLayer = null;

        // Gerçek GPS Konumunu Al
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(position => {
                userLat = position.coords.latitude;
                userLon = position.coords.longitude;
                map.setView([userLat, userLon], 15);
            }, err => console.log(err), { enableHighAccuracy: true });
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'tr-TR';
                window.speechSynthesis.speak(utterance);
            }
        }

        async function startNavigation() {
            const query = document.getElementById('destination').value;
            if (!query) { alert("Lütfen bir varış noktası yazın."); return; }

            speak("Rota oluşturuluyor. Keyifli sürüşler dilerim.");

            try {
                // Adresi koordinata çevirme (Geocoding)
                const geoRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
                const geoData = await geoRes.json();
                if (!geoData.length) { alert("Yer bulunamadı."); return; }

                const destLat = parseFloat(geoData[0].lat);
                const destLon = parseFloat(geoData[0].lon);

                // OpenRouteService ile Rota Çizimi (API Key)
                const apiKey = "eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6ImYzMTU3MGQ5YWU1NDQzYzRiYjBmZWNiYWYwNzAyZWZjIiwiaCI6Im11cm11cjY0In0=";
                const res = await fetch(`https://api.openrouteservice.org/v2/directions/driving-car/geojson`, {
                    method: 'POST',
                    headers: { 'Authorization': apiKey, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ coordinates: [[userLon, userLat], [destLon, destLat]] })
                });
                const data = await res.json();

                if (data.features) {
                    const summary = data.features[0].properties.summary;
                    document.getElementById('dist').innerText = (summary.distance / 1000).toFixed(1) + " km";
                    document.getElementById('time').innerText = Math.round(summary.duration / 60) + " dk";

                    if (routeLayer) map.removeLayer(routeLayer);
                    routeLayer = L.geoJSON(data, { style: { color: "#10b981", weight: 6 } }).addTo(map);
                    map.fitBounds(routeLayer.getBounds());

                    document.getElementById('search-card').style.display = 'none';
                    document.getElementById('nav-card').style.display = 'flex';
                }
            } catch (e) {
                alert("Rota hesaplanırken hata oluştu.");
            }
        }

        function endNavigation() {
            speak("Yolculuk bitmiştir. Mutlu günler dilerim.");
            if (routeLayer) map.removeLayer(routeLayer);
            document.getElementById('search-card').style.display = 'flex';
            document.getElementById('nav-card').style.display = 'none';
        }
    </script>
</body>
</html>
