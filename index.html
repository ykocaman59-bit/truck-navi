<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OtoNav - Akıllı Navigasyon</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #070e1b; color: #fff; height: 100vh; width: 100vw; overflow: hidden; display: flex; flex-direction: column; }
        
        #map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        .ui-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; }
        .interactive { pointer-events: auto; }

        /* Görseldeki Şık Kart Tasarımı */
        .card { background: rgba(12, 22, 45, 0.95); backdrop-filter: blur(12px); border: 1px solid #1e293b; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 12px 30px rgba(0,0,0,0.6); }
        
        .brand { text-align: center; margin-bottom: 4px; }
        .brand h1 { color: #38bdf8; font-size: 20px; font-weight: 800; letter-spacing: 1px; }
        .brand p { color: #94a3b8; font-size: 11px; }

        .input-box { background: #070e1b; border: 1px solid #334155; border-radius: 12px; padding: 12px; display: flex; align-items: center; gap: 10px; }
        .input-box input { background: none; border: none; color: #fff; font-size: 14px; outline: none; width: 100%; }

        .btn-primary { background: linear-gradient(135deg, #0284c7, #0369a1); color: white; border: none; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer; text-align: center; box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4); }
        .btn-danger { background: #ef4444; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4); }

        /* Navigasyon Aktifken Üst ve Alt HUD */
        .hud-top { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); border: 1px solid #334155; border-radius: 12px; padding: 12px 16px; display: flex; align-items: center; gap: 15px; }
        .hud-top .arrow { background: #0284c7; width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; }
        
        .hud-bottom { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); border: 1px solid #334155; border-radius: 12px; padding: 14px; display: flex; justify-content: space-around; text-align: center; }
        .hud-stat span:first-child { font-size: 11px; color: #94a3b8; display: block; }
        .hud-stat span:last-child { font-size: 16px; font-weight: bold; color: #38bdf8; }

        /* Alt Navigasyon Menü Çubuğu (Görseldeki Gibi) */
        .nav-bar { background: rgba(9, 16, 31, 0.95); border-top: 1px solid #1e293b; padding: 8px 0; display: flex; justify-content: space-around; backdrop-filter: blur(10px); margin: -15px -15px 0 -15px; border-radius: 0 0 0 0; }
        .nav-item { background: none; border: none; color: #64748b; font-size: 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
        .nav-item.active { color: #38bdf8; }
        .nav-item svg { width: 20px; height: 20px; fill: currentColor; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="ui-container">
        <!-- ARAMA VE ANA EKRAN KARTI -->
        <div class="card interactive" id="home-screen">
            <div class="brand">
                <h1>OTONAV</h1>
                <p>Otomobil Navigasyon Sistemi</p>
            </div>
            <div class="input-box">
                <span style="color: #10b981;">📍</span>
                <span style="font-size: 12px; color: #94a3b8;" id="current-location-text">Konum alınıyor...</span>
            </div>
            <div class="input-box">
                <span style="color: #ef4444;">🏁</span>
                <input type="text" id="destination" placeholder="Nereye gitmek istiyorsunuz? (Örn: Kadıköy)">
            </div>
            <button class="btn-primary" onclick="startNavigation()">Rotayı Oluştur</button>
        </div>

        <!-- AKTİF SÜRÜŞ HUD EKRANI -->
        <div id="nav-screen" style="display: none; display: flex; flex-direction: column; justify-content: space-between; height: 100%; pointer-events: none;">
            <div class="hud-top interactive">
                <div class="arrow">⬆</div>
                <div>
                    <div style="font-size: 14px; font-weight: bold; color: #fff;" id="next-instruction">Rota oluşturuldu</div>
                    <div style="font-size: 11px; color: #94a3b8;">Ana güzergah takip ediliyor</div>
                </div>
            </div>

            <div style="display: flex; flex-direction: column; gap: 10px;">
                <div class="hud-bottom interactive">
                    <div class="hud-stat"><span>Kalan Mesafe</span><span id="nav-dist">-- km</span></div>
                    <div style="border-left: 1px solid #334155;"></div>
                    <div class="hud-stat"><span>Tahmini Süre</span><span id="nav-time">-- dk</span></div>
                    <div style="border-left: 1px solid #334155;"></div>
                    <div class="hud-stat"><span>Varış Zamanı</span><span id="nav-arrival">--:--</span></div>
                </div>
                <button class="btn-primary btn-danger interactive" onclick="endNavigation()">Yolculuğu Bitir</button>
            </div>
        </div>

        <!-- GÖRSELDEKİ ALT MENÜ ÇUBUĞU -->
        <div class="nav-bar interactive">
            <button class="nav-item active">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                Ana Sayfa
            </button>
            <button class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                Harita
            </button>
            <button class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                Ayarlar
            </button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map', { zoomControl: false }).setView([41.0082, 28.9784], 13);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);

        let userLat = 41.0082, userLon = 28.9784;
        let routeLayer = null;

        // Gerçek Konum Takibi
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(position => {
                userLat = position.coords.latitude;
                userLon = position.coords.longitude;
                document.getElementById('current-location-text').innerText = "Konum Aktif (GPS)";
                map.setView([userLat, userLon], 15);
            }, err => {
                document.getElementById('current-location-text').innerText = "Konum alınamadı (Varsayılan: İstanbul)";
            }, { enableHighAccuracy: true });
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'tr-TR';
                window.speechSynthesis.speak(utterance);
            }
        }

        async function startNavigation() {
            const query = document.getElementById('destination').value;
            if (!query) { alert("Lütfen bir varış noktası yazın."); return; }

            speak("Rota oluşturuluyor. Keyifli sürüşler dilerim.");

            try {
                // Konum Çözümleme (Nominatim)
                const geoRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
                const geoData = await geoRes.json();
                if (!geoData.length) { alert("Hedef konum bulunamadı."); return; }

                const destLat = parseFloat(geoData[0].lat);
                const destLon = parseFloat(geoData[0].lon);

                // OpenRouteService Otomobil Rotası
                const apiKey = "eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6ImYzMTU3MGQ5YWU1NDQzYzRiYjBmZWNiYWYwNzAyZWZjIiwiaCI6Im11cm11cjY0In0=";
                const res = await fetch(`https://api.openrouteservice.org/v2/directions/driving-car/geojson`, {
                    method: 'POST',
                    headers: { 'Authorization': apiKey, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ coordinates: [[userLon, userLat], [destLon, destLat]] })
                });
                const data = await res.json();

                if (data.features) {
                    const summary = data.features[0].properties.summary;
                    const distKm = (summary.distance / 1000).toFixed(1);
                    const durationMins = Math.round(summary.duration / 60);

                    document.getElementById('nav-dist').innerText = distKm + " km";
                    document.getElementById('nav-time').innerText = durationMins + " dk";

                    const arrivalTime = new Date(Date.now() + summary.duration * 1000);
                    document.getElementById('nav-arrival').innerText = arrivalTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                    if (routeLayer) map.removeLayer(routeLayer);
                    routeLayer = L.geoJSON(data, { style: { color: "#38bdf8", weight: 6, opacity: 0.9 } }).addTo(map);
                    map.fitBounds(routeLayer.getBounds());

                    document.getElementById('home-screen').style.display = 'none';
                    document.getElementById('nav-screen').style.display = 'flex';
                }
            } catch (e) {
                alert("Rota oluşturulurken bir hata oluştu.");
            }
        }

        function endNavigation() {
            speak("Yolculuk bitmiştir. Mutlu günler dilerim.");
            if (routeLayer) map.removeLayer(routeLayer);
            document.getElementById('home-screen').style.display = 'flex';
            document.getElementById('nav-screen').style.display = 'none';
            map.setView([userLat, userLon], 15);
        }
    </script>
</body>
</html>
