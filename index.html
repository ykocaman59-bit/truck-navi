<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OtoNav - Standart Navigasyon Prototipi</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0b132b; color: #fff; display: flex; flex-direction: column; height: 100vh; width: 100vw; overflow: hidden; }

        #map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        .ui-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; display: flex; flex-direction: column; pointer-events: none; justify-content: space-between; padding: 15px; }
        .interactive { pointer-events: auto; }

        .top-card { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); border: 1px solid #334155; border-radius: 14px; padding: 15px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .top-card h2 { font-size: 15px; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
        
        .input-group { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 11px; color: #94a3b8; }
        input { padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #070e1b; color: #fff; font-size: 13px; outline: none; }

        .btn-go { background: #10b981; color: white; border: none; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; text-align: center; }

        .bottom-hud { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); border: 1px solid #334155; border-radius: 14px; padding: 12px 20px; display: flex; justify-content: space-around; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .hud-val { font-size: 16px; font-weight: bold; color: #38bdf8; }
        .hud-lbl { font-size: 10px; color: #94a3b8; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="ui-overlay">
        <div class="top-card interactive">
            <h2>🚗 OtoNav Rota Planlayıcı</h2>
            <div class="input-group">
                <label>Nereden (Boylam, Enlem)</label>
                <input type="text" id="start" value="29.0, 41.0">
            </div>
            <div class="input-group">
                <label>Nereye (Boylam, Enlem)</label>
                <input type="text" id="end" value="29.1, 41.1">
            </div>
            <button class="btn-go" onclick="drawRoute()">Rotayı Hesapla</button>
        </div>

        <div class="bottom-hud interactive">
            <div>
                <div class="hud-val" id="dist">--</div>
                <div class="hud-lbl">Mesafe</div>
            </div>
            <div style="border-left: 1px solid #334155;"></div>
            <div>
                <div class="hud-val" id="time">--</div>
                <div class="hud-lbl">Tahmini Süre</div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map', { zoomControl: false }).setView([41.0, 29.0], 12);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);

        let currentRoute = null;

        async function drawRoute() {
            const start = document.getElementById('start').value.split(',').map(v => parseFloat(v.trim()));
            const end = document.getElementById('end').value.split(',').map(v => parseFloat(v.trim()));
            const apiKey = "eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6ImYzMTU3MGQ5YWU1NDQzYzRiYjBmZWNiYWYwNzAyZWZjIiwiaCI6Im11cm11cjY0In0=";

            try {
                const res = await fetch(`https://api.openrouteservice.org/v2/directions/driving-car/geojson`, {
                    method: 'POST',
                    headers: { 'Authorization': apiKey, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ coordinates: [start, end] })
                });
                const data = await res.json();
                
                if(data.features) {
                    const summary = data.features[0].properties.summary;
                    document.getElementById('dist').innerText = (summary.distance / 1000).toFixed(1) + " km";
                    document.getElementById('time').innerText = Math.round(summary.duration / 60) + " dk";

                    if(currentRoute) map.removeLayer(currentRoute);
                    currentRoute = L.geoJSON(data, { style: { color: "#10b981", weight: 6 } }).addTo(map);
                    map.fitBounds(currentRoute.getBounds());
                }
            } catch(e) {
                alert("Rota çizilemedi.");
            }
        }
    </script>
</body>
</html>
