<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ağır Vasıta Navigasyon</title>
  
  <!-- Leaflet CSS (Haritanın görünmesi için şarttır) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- Sizin stil dosyanız -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="sidebar">
    <h2>Ağır Vasıta Rotası</h2>

    <div class="input-group">
      <label>Araç Tipi:</label>
      <select id="vehicleType">
        <option value="driving-hgv">Kamyon / Tır (HGV)</option>
        <option value="driving-car">Binek Araç (Test)</option>
      </select>
    </div>

    <div class="input-group">
      <label>Maksimum Yükseklik (m):</label>
      <input type="number" id="maxHeight" value="4.0" step="0.1">
    </div>

    <div class="input-group">
      <label>Maksimum Ağırlık (Ton):</label>
      <input type="number" id="maxWeight" value="18" step="1">
    </div>

    <div class="input-group">
      <label>Genişlik (m):</label>
      <input type="number" id="maxWidth" value="2.5" step="0.1">
    </div>

    <hr>
    <p class="info">Haritaya tıklayarak <strong>Başlangıç</strong> ve <strong>Varış</strong> noktalarını belirleyin.</p>
    <button id="clearBtn">Temizle</button>
    <div id="routeInfo"></div>
  </div>

  <div id="map"></div>

  <!-- Leaflet JS ve Uygulama Kodu -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
