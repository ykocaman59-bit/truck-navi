name: TIRNAV Flutter APK Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repo Kodlarını İndir
        uses: actions/checkout@v3

      - name: Java (JDK) Ortamını Kur
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter SDK Kurulumu
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Eksik Android Dosyalarını Oluştur (flutter create)
        run: |
          # Eğer android klasörü yoksa projeye otomatik ekler
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --org com.tirnav.app
          else
            # Zaten varsa ama eksik dosyalar varsa tamamlar
            flutter create . --platforms=android --org com.tirnav.app --overwrite
          fi

      - name: Android Manifest ve İzinleri Düzenle
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          
          if [ -f "$MANIFEST_PATH" ]; then
            echo "AndroidManifest.xml bulundu, izinler ve uygulama adı güncelleniyor..."
            
            sed -i 's/android:label="[^"]*"/android:label="TIRNAV"/g' $MANIFEST_PATH
            
            if ! grep -q "ACCESS_FINE_LOCATION" "$MANIFEST_PATH"; then
              sed -i '/<uses-permission android:name="android.permission.INTERNET"/a \    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' $MANIFEST_PATH
            fi
          fi

      - name: Bağımlılıkları Yükle (flutter pub get)
        run: flutter pub get

      - name: APK Derle (Release)
        run: flutter build apk --release

      - name: APK Dosyasını Yeniden Adlandır ve Kaydet
        run: |
          mkdir -p output
          cp build/app/outputs/flutter-apk/app-release.apk output/TIRNAV.apk

      - name: APK Dosyasını Kaydet (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: TIRNAV
          path: output/TIRNAV.apk
          
